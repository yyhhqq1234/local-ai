<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>鹈鹕骑自行车</title>
<style>
body {
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background: #87CEEB;
  overflow: hidden;
}
svg {
  width: 90vmin;
  height: 60vmin;
}
.cloud {
  animation: cloudMove 8s linear infinite;
}
.cloud2 {
  animation: cloudMove 12s linear infinite;
}
@keyframes cloudMove {
  from { transform: translateX(0); }
  to { transform: translateX(-200px); }
}
.ground {
  animation: groundMove 1s linear infinite;
}
@keyframes groundMove {
  from { transform: translateX(0); }
  to { transform: translateX(40px); }
}
.wheel {
  animation: spin 0.8s linear infinite;
  transform-origin: center;
}
.wheel-front {
  transform-origin: 420px 220px;
}
.wheel-rear {
  transform-origin: 280px 220px;
}
.pedal-group {
  animation: pedalSpin 0.8s linear infinite;
  transform-origin: 350px 210px;
}
.bird-body {
  animation: bob 0.4s ease-in-out infinite alternate;
}
@keyframes bob {
  from { transform: translateY(0); }
  to { transform: translateY(-3px); }
}
.bird-leg {
  animation: legPedal 0.8s linear infinite;
  transform-origin: 350px 180px;
}
.bird-leg2 {
  animation: legPedal2 0.8s linear infinite;
  transform-origin: 350px 180px;
}
@keyframes legPedal {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
@keyframes legPedal2 {
  0% { transform: rotate(180deg); }
  100% { transform: rotate(540deg); }
}
.tree {
  animation: treeMove 3s linear infinite;
}
@keyframes treeMove {
  from { transform: translateX(0); }
  to { transform: translateX(-120px); }
}
</style>
</head>
<body>
<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky -->
  <rect x="0" y="0" width="800" height="500" fill="#87CEEB"/>
  
  <!-- Clouds -->
  <g class="cloud">
    <ellipse cx="100" cy="60" rx="50" ry="20" fill="white" opacity="0.8"/>
    <ellipse cx="130" cy="55" rx="40" ry="18" fill="white" opacity="0.8"/>
    <ellipse cx="70" cy="58" rx="35" ry="15" fill="white" opacity="0.8"/>
  </g>
  <g class="cloud2">
    <ellipse cx="500" cy="40" rx="60" ry="22" fill="white" opacity="0.7"/>
    <ellipse cx="540" cy="35" rx="45" ry="18" fill="white" opacity="0.7"/>
    <ellipse cx="470" cy="38" rx="40" ry="16" fill="white" opacity="0.7"/>
  </g>
  <g class="cloud">
    <ellipse cx="650" cy="80" rx="45" ry="18" fill="white" opacity="0.6"/>
    <ellipse cx="680" cy="75" rx="35" ry="15" fill="white" opacity="0.6"/>
  </g>

  <!-- Sun -->
  <circle cx="700" cy="60" r="40" fill="#FFD700"/>
  <circle cx="700" cy="60" r="35" fill="#FFE44D"/>

  <!-- Ground -->
  <rect x="0" y="380" width="800" height="120" fill="#4CAF50"/>
  <rect x="0" y="370" width="800" height="15" fill="#66BB6A"/>
  
  <!-- Road -->
  <rect x="0" y="395" width="800" height="40" fill="#555"/>
  <g class="ground">
    <line x1="0" y1="415" x2="800" y2="415" stroke="white" stroke-width="3" stroke-dasharray="30,20"/>
  </g>

  <!-- Trees in background -->
  <g class="tree">
    <rect x="50" y="320" width="15" height="55" fill="#8B4513"/>
    <ellipse cx="57" cy="300" rx="35" ry="45" fill="#2E8B57"/>
  </g>
  <g class="tree">
    <rect x="200" y="330" width="12" height="45" fill="#8B4513"/>
    <ellipse cx="206" cy="310" rx="30" ry="40" fill="#3CB043"/>
  </g>
  <g class="tree">
    <rect x="400" y="325" width="14" height="50" fill="#8B4513"/>
    <ellipse cx="407" cy="305" rx="32" ry="42" fill="#228B22"/>
  </g>
  <g class="tree">
    <rect x="600" y="330" width="13" height="45" fill="#8B4513"/>
    <ellipse cx="606" cy="310" rx="28" ry="38" fill="#2E8B57"/>
  </g>

  <!-- Bicycle and Pelican group -->
  <g>
    <!-- Rear wheel -->
    <g>
      <circle cx="280" cy="220" r="45" fill="none" stroke="#333" stroke-width="4"/>
      <circle cx="280" cy="220" r="42" fill="none" stroke="#666" stroke-width="2"/>
      <circle cx="280" cy="220" r="5" fill="#333"/>
      <!-- Spokes -->
      <g class="wheel wheel-rear">
        <line x1="280" y1="178" x2="280" y2="262" stroke="#888" stroke-width="1.5"/>
        <line x1="238" y1="220" x2="322" y2="220" stroke="#888" stroke-width="1.5"/>
        <line x1="250" y1="190" x2="310" y2="250" stroke="#888" stroke-width="1.5"/>
        <line x1="250" y1="250" x2="310" y2="190" stroke="#888" stroke-width="1.5"/>
        <line x1="260" y1="183" x2="300" y2="257" stroke="#888" stroke-width="1.5"/>
        <line x1="260" y1="257" x2="300" y2="183" stroke="#888" stroke-width="1.5"/>
      </g>
      <circle cx="280" cy="220" r="3" fill="#555"/>
    </g>

    <!-- Front wheel -->
    <g>
      <circle cx="420" cy="220" r="45" fill="none" stroke="#333" stroke-width="4"/>
      <circle cx="420" cy="220" r="42" fill="none" stroke="#666" stroke-width="2"/>
      <circle cx="420" cy="220" r="5" fill="#333"/>
      <g class="wheel wheel-front">
        <line x1="420" y1="178" x2="420" y2="262" stroke="#888" stroke-width="1.5"/>
        <line x1="378" y1="220" x2="462" y2="220" stroke="#888" stroke-width="1.5"/>
        <line x1="390" y1="190" x2="450" y2="250" stroke="#888" stroke-width="1.5"/>
        <line x1="390" y1="250" x2="450" y2="190" stroke="#888" stroke-width="1.5"/>
        <line x1="400" y1="183" x2="440" y2="257" stroke="#888" stroke-width="1.5"/>
        <line x1="400" y1="257" x2="440" y2="183" stroke="#888" stroke-width="1.5"/>
      </g>
      <circle cx="420" cy="220" r="3" fill="#555"/>
    </g>

    <!-- Bike frame -->
    <line x1="280" y1="220" x2="350" y2="210" stroke="#CC3333" stroke-width="4" stroke-linecap="round"/>
    <line x1="350" y1="210" x2="420" y2="220" stroke="#CC3333" stroke-width="4" stroke-linecap="round"/>
    <line x1="350" y1="210" x2="340" y2="160" stroke="#CC3333" stroke-width="4" stroke-linecap="round"/>
    <line x1="420" y1="220" x2="400" y2="155" stroke="#CC3333" stroke-width="4" stroke-linecap="round"/>
    <line x1="340" y1="160" x2="400" y2="155" stroke="#CC3333" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Seat post -->
    <line x1="340" y1="160" x2="335" y2="140" stroke="#333" stroke-width="3"/>
    <!-- Seat -->
    <ellipse cx="335" cy="138" rx="12" ry="5" fill="#333"/>
    
    <!-- Handlebar -->
    <line x1="400" y1="155" x2="395" y2="130" stroke="#333" stroke-width="3"/>
    <line x1="385" y1="130" x2="405" y2="130" stroke="#333" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Pedals -->
    <g class="pedal-group">
      <circle cx="350" cy="210" r="8" fill="#444"/>
      <line x1="350" y1="210" x2="370" y2="230" stroke="#555" stroke-width="3" stroke-linecap="round"/>
      <line x1="350" y1="210" x2="330" y2="190" stroke="#555" stroke-width="3" stroke-linecap="round"/>
      <rect x="365" y="225" width="12" height="5" rx="2" fill="#333"/>
      <rect x="323" y="185" width="12" height="5" rx="2" fill="#333"/>
    </g>

    <!-- Bird legs (on pedals) -->
    <g class="bird-leg">
      <line x1="335" y1="145" x2="370" y2="230" stroke="#FFA500" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="372" cy="232" rx="8" ry="4" fill="#FF8C00"/>
    </g>
    <g class="bird-leg2">
      <line x1="335" y1="145" x2="330" y2="190" stroke="#FFA500" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="328" cy="188" rx="8" ry="4" fill="#FF8C00"/>
    </g>

    <!-- Pelican body -->
    <g class="bird-body">
      <!-- Body -->
      <ellipse cx="340" cy="110" rx="45" ry="35" fill="white" stroke="#DDD" stroke-width="1"/>
      
      <!-- Wing -->
      <path d="M 310 105 Q 290 95 300 120 Q 310 130 325 115 Z" fill="#D4D4D4" stroke="#BBB" stroke-width="1"/>
      
      <!-- Tail -->
      <path d="M 295 100 Q 275 90 270 105 Q 275 115 295 110 Z" fill="#E8E8E8" stroke="#CCC" stroke-width="1"/>
      
      <!-- Head -->
      <circle cx="395" cy="75" r="25" fill="white" stroke="#DDD" stroke-width="1"/>
      
      <!-- Eye -->
      <circle cx="405" cy="70" r="5" fill="white"/>
      <circle cx="406" cy="70" r="3" fill="#333"/>
      <circle cx="407" cy="69" r="1" fill="white"/>
      
      <!-- Beak (large pelican beak) -->
      <path d="M 415 75 Q 460 70 470 80 Q 465 90 420 88 Q 415 85 415 75 Z" fill="#FFD700" stroke="#E6B800" stroke-width="1"/>
      <!-- Lower beak pouch -->
      <path d="M 415 88 Q 440 100 460 95 Q 455 88 420 88 Z" fill="#FFA500" stroke="#E6B800" stroke-width="1"/>
      
      <!-- Neck -->
      <path d="M 380 95 Q 370 100 375 110 Q 385 115 395 105 Q 390 95 380 95 Z" fill="white" stroke="#DDD" stroke-width="0.5"/>
      
      <!-- Head feather tuft -->
      <path d="M 395 52 Q 390 45 395 40 Q 400 45 398 52" fill="#FFA500"/>
    </g>
  </g>

  <!-- Motion lines -->
  <g opacity="0.5">
    <line x1="180" y1="200" x2="220" y2="200" stroke="#AAA" stroke-width="2" stroke-linecap="round">
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="0.5s" repeatCount="indefinite"/>
    </line>
    <line x1="170" y1="215" x2="215" y2="215" stroke="#AAA" stroke-width="2" stroke-linecap="round">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="0.5s" repeatCount="indefinite"/>
    </line>
    <line x1="175" y1="230" x2="210" y2="230" stroke="#AAA" stroke-width="2" stroke-linecap="round">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="0.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Dust particles -->
  <circle cx="250" cy="265" r="3" fill="#C4A86B" opacity="0.6">
    <animate attributeName="cx" values="250;220;200" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="265;260;255" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.3;0" dur="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="260" cy="268" r="2" fill="#C4A86B" opacity="0.5">
    <animate attributeName="cx" values="260;230;210" dur="0.8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="268;262;258" dur="0.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.2;0" dur="0.8s" repeatCount="indefinite"/>
  </circle>
</svg>
</body>
</html>
