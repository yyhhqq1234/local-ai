# dsh-ninfer-local 自装配补丁
#
# 2026-11-15 停用：本包是 plugins/dsh-local-ai 的旧复制品（2026-11-08），
#   engineDir 指向已废弃的 ninfer-csunx / _tools/ninfer-build，模型路径为死链；
#   两者同注册 provider "ninfer" → 后加载者抛 DUPLICATE_ADAPTER，
#   整个 fiber 变 [failed]（插件面板显示"异常"）。
#   主线 = @dsh-external/dsh-local-ai（9B llama.cpp + 27B 外部档），本包不再装载。
#   需要复查时把 disabled 去掉即可（lib 里已加 provider 占用检测，不会再把宿主打挂）。
- insert:
    - id: dsh-ninfer-local
      name: '@dsh-external/dsh-ninfer-local'
      disabled: true
      config:
        engineDir: 'D:/BaiduNetdiskDownload/Local-AI/engines/ninfer-27b'
        baseURL: 'http://127.0.0.1:8080/v1'
        # 撞名保护已内置在 lib/index.js；此处置 false 作为第二道闸
        registerAdapter: false
